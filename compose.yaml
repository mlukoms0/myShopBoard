
# Start:   docker compose up -d
# Stop:    docker compose down         
# Reset:   docker compose down -v       
# Logs:    docker compose logs -f postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: myshopboard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: myshopboard
      POSTGRES_USER: postgres
      # Local development only.
      POSTGRES_PASSWORD: postgres

    ports:
      # HOST:CONTAINER
      - "5435:5432"

    volumes:
      - myshopboard-pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myshopboard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  myshopboard-pgdata:
    name: myshopboard-pgdata
